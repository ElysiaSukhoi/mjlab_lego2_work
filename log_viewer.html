<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lego2 策略日志</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f7f5f2;
      --fg: #1c1917;
      --muted: #78716c;
      --card: #ffffff;
      --border: #e7e5e4;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 28%);
      color: var(--fg);
      line-height: 1.55;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    .banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .banner code {
      background: #f5f5f4;
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--fg);
    }
    #content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
    }
    #content h1 { margin-top: 0; }
    #content h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-top: 1.6em;
    }
    #content table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      overflow-x: auto;
      display: block;
    }
    #content th, #content td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    #content th { background: #f5f5f4; }
    #content details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px 12px;
      margin: 12px 0 20px;
      background: #fafaf9;
    }
    #content summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
      padding: 6px 0;
      list-style: none;
    }
    #content summary::-webkit-details-marker { display: none; }
    #content summary::before {
      content: "▸ ";
      display: inline-block;
      transition: transform .15s;
    }
    #content details[open] summary::before { transform: rotate(90deg); }
    #content pre {
      background: #1c1917;
      color: #fafaf9;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }
    #content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
    #err { color: #b91c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner" id="banner" hidden></div>
    <div id="content"><p>加载中…</p></div>
    <pre id="err" hidden></pre>
  </div>
  <script>
    marked.setOptions({ gfm: true, breaks: false });
    fetch("./日志.md", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status + " — 请用本地 http.server 打开，不要直接双击 HTML");
        return r.text();
      })
      .then((md) => {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch((e) => {
        document.getElementById("content").innerHTML = "";
        const err = document.getElementById("err");
        err.hidden = false;
        err.textContent = String(e) + "\n\n启动方式：\n  cd ~/yhy/mjlab\n  python3 -m http.server 8765\n  浏览器打开 http://localhost:8765/log_viewer.html";
      });
  </script>
</body>
</html>
